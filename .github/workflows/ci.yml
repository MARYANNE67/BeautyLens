name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed paths
        id: filter
        run: |
          BASE=${{ github.base_ref || 'main' }}
          git fetch origin $BASE
          CHANGED=$(git diff --name-only origin/$BASE...HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^beautylens/src/|^beautylens/package|^beautylens/tsconfig|^beautylens/app\.json'; then
            echo "frontend=true" >> $GITHUB_OUTPUT
          else
            echo "frontend=false" >> $GITHUB_OUTPUT
          fi
          if echo "$CHANGED" | grep -qE '^beautylens/src/api/|^beautylens/requirements\.txt|^beautylens/tests/'; then
            echo "backend=true" >> $GITHUB_OUTPUT
          else
            echo "backend=false" >> $GITHUB_OUTPUT
          fi

  security:
    name: Security — Repo Hygiene Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for hardcoded absolute/user paths
        run: |
          if grep -rEn '/Users/[A-Za-z0-9_.-]+|/home/[A-Za-z0-9_.-]+|OneDrive' --include="*.py" beautylens/src/; then
            echo "::error::Hardcoded absolute/user-specific path found in source files"
            exit 1
          fi

      - name: Confirm .env is not committed
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "::error::.env file is committed to the repository"
            exit 1
          fi

      - name: Secret scan (gitleaks)
        # Catches keys/tokens committed in source files -- stronger than the
        # .env check below, which only catches the whole file being added.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for large model weight files (>5MB)
        run: |
          status=0
          for f in $(git ls-files '*.pt'); do
            size=$(stat -c%s "$f")
            if [ "$size" -gt 5242880 ]; then
              echo "::error file=$f::Model weight file $f is $size bytes (>5MB) and should not be committed"
              status=1
            fi
          done
          exit $status

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    name: Frontend — Type Check, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beautylens

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: beautylens/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (npm audit, critical only)
        # Moderate/high findings live in the Expo SDK 54 build toolchain and
        # are accepted until the next SDK upgrade -- see docs/SecurityAudit.md
        # Finding 5. Criticals always fail the build.
        run: npm audit --audit-level=critical

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # --passWithNoTests was dropped once a real Jest suite existed: with it,
      # a jest config typo that collects zero tests would pass green while
      # testing nothing. "No tests found" should be a loud failure now.
      - name: Test
        run: npx jest

      - name: Expo export
        run: npx expo export --platform web 2>&1 | grep -v "^warn"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: sudo apt-get install -y libgl1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: beautylens/requirements.txt

      - name: Install dependencies
        run: pip install -r beautylens/requirements.txt pylint pytest pytest-cov httpx pytest-asyncio
        env:
          PIP_NO_DEPS: "false"
          MEDIAPIPE_DISABLE_GPU: "1"

      - name: Dependency audit (pip-audit)
        # protobuf PYSEC-2026-1805/1806 are accepted: mediapipe 0.10.9 pins
        # protobuf<4 and the fixes need >=4.25.8 -- see docs/SecurityAudit.md
        # Finding 6. Everything else fails the build.
        run: |
          pip install -q pip-audit
          pip-audit -r beautylens/requirements.txt --no-deps \
            --ignore-vuln PYSEC-2026-1805 --ignore-vuln PYSEC-2026-1806

      - name: Pylint
        run: pylint beautylens/src/api/ --errors-only --ignored-modules=cv2,mediapipe

      - name: PyTest
        run: |
          if find beautylens/tests -name "test_*.py" | grep -q .; then
            pytest beautylens/tests/ -q \
              --cov=beautylens/src/api \
              --cov-fail-under=80 \
              --cov-report=term-missing
          else
            echo "No test files found — skipping coverage enforcement"
          fi
