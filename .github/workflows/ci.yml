name: CI

on:
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend — Type Check, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beautylens

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx jest --passWithNoTests

      - name: Expo export
        run: npx expo export --platform web 2>&1 | grep -v "^warn"

  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: sudo apt-get install -y libgl1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: beautylens/requirements.txt

      - name: Install dependencies
        run: pip install -r beautylens/requirements.txt pylint pytest pytest-cov httpx pytest-asyncio

      - name: Pylint
        run: pylint beautylens/src/api/ --errors-only

      - name: PyTest
        # exit code 5 = no tests collected — passes until test files are added
        # coverage enforcement kicks in once tests exist
        run: |
          pytest beautylens/src/tests/ -q \
            --cov=beautylens/src/api \
            --cov-fail-under=80 \
            --cov-report=term-missing \
            || [ $? -eq 5 ]
